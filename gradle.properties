org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Toolchain and Android platform levels. Kept out of the dependency catalog because they are
# build settings, not dependencies.
slipgate.jvmToolchain=21
slipgate.androidCompileSdk=37
slipgate.androidMinSdk=24
slipgate.androidTargetSdk=37
