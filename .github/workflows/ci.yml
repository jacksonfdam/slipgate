name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck detekt

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :android:assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :web:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v7
        with:
          name: web-distribution
          path: web/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Link the framework for device
        run: ./gradlew :ios:linkDebugFrameworkIosArm64
      - name: Build the simulator app
        run: |
          xcodebuild -project ios/Slipgate.xcodeproj \
            -scheme Slipgate \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/xcode-derived \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

  engine-sources:
    name: Engine sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the sources match SOURCES.lock
        run: ./tooling/engine-build/fetch-sources.sh
      - name: Verify the wasm modules match their hashes and use no vector instructions
        run: ./tooling/ci/verify-wasm-artifacts.sh

  unit-tests:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew allTests
